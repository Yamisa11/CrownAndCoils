name: Deploy to Render

on:
  push:
    branches:
      - main  # Trigger this workflow on pushes to the `main` branch

jobs:
  build:
    runs-on: ubuntu-latest  # This specifies the virtual environment for your build

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Use the appropriate version for your project

      # Install dependencies
      - name: Install dependencies
        run: |
          npm install

      # Run build
      - name: Build project
        run: |
          npm run build  # This will run the build command from your package.json

      # Deploy to Render (example: if using Render CLI)
      - name: Deploy to Render
        run: |
          # For example, if using Render CLI to deploy, you can add commands here
          # render deploy --service <your-service-name>
