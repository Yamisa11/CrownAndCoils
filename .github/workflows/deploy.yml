name: Deploy Project

# Trigger workflow on push to the main branch or PR to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Runs on the latest Ubuntu version

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v2  # Checkout the code from the repo

      # Step 2: Set up Node.js (ensure compatibility with Next.js)
      - name: Set up Node.js
        uses: actions/setup-node@v2  # Action for setting up Node.js
        with:
          node-version: '18'  # Use Node version 18, which is compatible with Next.js

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install  # Install your project's dependencies (including TailwindCSS)

      # Step 4: Build the Next.js project
      - name: Build the project
        run: npm run build  # Run the Next.js build command

      # Step 5: Deploy the project (optional - depends on your platform)
      # Add deployment steps here based on your deployment service (e.g., Render, Vercel)
      - name: Deploy
        run: |
          echo "Add your deployment steps here (for example, Render, Vercel, etc.)"
